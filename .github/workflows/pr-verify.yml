name: PR Verify

on:
  pull_request:
    branches:
      - staging
      - prod

env:
  AWS_REGION: eu-west-1

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'lambda/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  validate-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v2
        with:
          directory: terraform/
          framework: terraform
          quiet: false
          soft_fail: true

  plan:
    runs-on: ubuntu-latest
    needs: [security-scan, validate-iac]
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    # Uses the same per-environment deploy role as the real deploy workflows,
    # scoped to that environment's GitHub Environment secrets - read-only in
    # effect since this job only ever runs `terraform plan`.
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Lambda package (needed for plan to hash the artifact)
        run: |
          cd lambda
          pip install -r requirements.txt -t package/
          cp handler.py package/
          cd package
          zip -r ../deployment.zip .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend-config=backend-configs/${{ matrix.environment }}.backend

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan -var-file=environments/${{ matrix.environment }}.tfvars -no-color | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### Terraform Plan - \`${{ matrix.environment }}\`\n\`\`\`\n${plan}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
