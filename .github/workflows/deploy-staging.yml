name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# Least-privilege default; individual jobs elevate only what they need.
permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_VAR_FILE: terraform/environments/staging.tfvars
  BACKEND_CONFIG: terraform/backend-configs/staging.backend

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # Trivy performs filesystem vulnerability scanning,
      # including detected Python dependencies.
      - uses: actions/checkout@v5

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'lambda/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        # Requires GitHub Advanced Security, which isn't available on private
        # repos under the free plan. Non-fatal so the scan still runs and the
        # pipeline isn't blocked; once this repo is public (or on a plan with
        # Advanced Security) results will start appearing in the Security tab.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  validate-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.8.5'

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@v2
        with:
          directory: terraform/
          framework: terraform
          quiet: false
          soft_fail: true

  package-lambda:
    runs-on: ubuntu-latest
    needs: [security-scan, validate-iac]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd lambda
          pip install -r requirements.txt -t package/
          cp handler.py package/

      - name: Create deployment package
        run: |
          cd lambda/package
          zip -r ../deployment.zip .
          cd ..
          ls -lh deployment.zip

      - name: Upload Lambda package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment
          path: lambda/deployment.zip
          retention-days: 5

  deploy-staging:
    runs-on: ubuntu-latest
    needs: package-lambda
    environment: staging
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-deployment
          path: lambda/

      # TEMPORARY - debugging an AssumeRoleWithWebIdentity failure. Prints the
      # decoded claims (not the raw token) so we can compare against the IAM
      # role's trust policy condition. Remove once resolved.
      - name: Debug - print OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64').toString());
            core.info(`aud: ${JSON.stringify(payload.aud)}`);
            core.info(`sub: ${payload.sub}`);
            core.info(`repository: ${payload.repository}`);
            core.info(`repository_owner: ${payload.repository_owner}`);
            core.info(`environment: ${payload.environment}`);
            core.info(`ref: ${payload.ref}`);
            core.info(`event_name: ${payload.event_name}`);
            core.info(`iss: ${payload.iss}`);

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.8.5'

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend-config=${{ env.BACKEND_CONFIG }}

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -var-file=${{ env.TF_VAR_FILE }} -out=tfplan

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve tfplan

      - name: Output API endpoint
        run: |
          cd terraform
          terraform output -raw api_invoke_url

      - name: Notify deployment
        run: |
          echo "✅ Staging deployment complete!"
          echo "API Endpoint: $(cd terraform && terraform output -raw api_invoke_url)"
